<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐉 Kali GPT - Hacker UI</title>
  <style>
    body {
      background: #0d0d0d;
      color: #00ff66;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    /* MATRIX BACKGROUND */
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: black;
    }

    /* Splash screen */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: #00ff66;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.2em;
      z-index: 9999;
      animation: fadeOut 2s ease-in forwards;
      animation-delay: 6s;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .log {
      opacity: 0;
      margin: 3px 0;
      white-space: nowrap;
      overflow: hidden;
      border-right: .15em solid #00ff66;
    }

    .log.show {
      opacity: 1;
      animation: typing 2s steps(40, end) forwards, blink .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    /* Terminal container */
    .terminal {
      background: #000;
      border: 2px solid #00ff66;
      border-radius: 12px;
      box-shadow: 0 0 20px #00ff66;
      padding: 10px;
      opacity: 0;
      transform: scale(0.95);
      animation: showTerminal 1s ease forwards;
      animation-delay: 8s;
    }

    @keyframes showTerminal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
      border-radius: 8px;
      background: #0d0d0d;
    }

    /* CRT Scanline Effect */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 100, 0.05) 0px,
        rgba(0, 255, 100, 0.05) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Credit footer */
    footer {
      text-align: center;
      color: #00ff66;
      font-size: 0.8em;
      margin-top: 15px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!-- MATRIX BACKGROUND -->
  <canvas id="matrix"></canvas>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="log" id="log1">[BOOT] Initializing Kali GPT Environment...</div>
    <div class="log" id="log2">[SYSTEM] Loading kernel modules █████▒▒▒▒▒ 65%</div>
    <div class="log" id="log3">[NETWORK] Establishing secure connection...</div>
    <div class="log" id="log4">[ACCESS GRANTED] Welcome, Operator.</div>
  </div>

  <!-- Terminal -->
  <div class="terminal">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span style="color:#00ff66; margin-left:10px;">🐉 Kali GPT</span>
    </div>
    <iframe src="https://www.yeschat.ai/i/gpts-2OTogs7LnT-🐉-Kali-GPT"></iframe>
    <footer>
      Made with 💻⚡ by Dva.11 · Powered with help from ChatGPT
    </footer>
  </div>

  <div class="scanline"></div>

  <script>
    // MATRIX EFFECT
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const letters = 'アァイィウヴエェオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモヤユヨラリルレロワヰヱヲンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const matrix = letters.split('');

    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];

    for(let x = 0; x < columns; x++)
      drops[x] = 1;

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for(let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random()*matrix.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975)
          drops[i] = 0;

        drops[i]++;
      }
    }

    setInterval(draw, 33);

    // LOG SEQUENCE
    setTimeout(()=>document.getElementById('log1').classList.add('show'), 500);
    setTimeout(()=>document.getElementById('log2').classList.add('show'), 2000);
    setTimeout(()=>document.getElementById('log3').classList.add('show'), 3500);
    setTimeout(()=>document.getElementById('log4').classList.add('show'), 5000);
  </script>
</body>
</html>
